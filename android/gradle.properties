org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---------------------------------------------------------------------------
# Kotlin 增量编译关闭
#
# 原因：Windows 上编译 shared_preferences_android 等插件的 Kotlin 代码时，
# 反复出现「Could not close incremental caches ... class-fq-name-to-source.tab」。
# 这是 Kotlin 增量编译缓存在 Windows 上被文件锁（杀毒软件/索引服务）占用导致的，
# 清理 build 目录与 Gradle daemon 都无法根治。
#
# 关闭增量编译后全量编译，代价是首次构建慢十几秒，换来构建稳定。
# ---------------------------------------------------------------------------
kotlin.incremental=false
kotlin.incremental.android=false

# Gradle 构建缓存也一并关闭，避免同类缓存问题
org.gradle.caching=false
